[project]
name = "ai-agent-bootcamp"
version = "0.1.0"
description = "AI Agent 工程实践项目：从工程地基到 RAG / Agent / 微调"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
